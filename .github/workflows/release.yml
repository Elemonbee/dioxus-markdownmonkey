name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label, for example v0.6.4"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: MarkdownMonkey
  # Declared so later ${{ env.* }} expressions are valid; pack steps overwrite via GITHUB_ENV.
  # 预先声明供后续 ${{ env.* }} 通过校验，打包步骤再用 GITHUB_ENV 覆盖。
  PACKAGE_VERSION: ""
  PACKAGE_ZIP: ""
  PACKAGE_SHA: ""
  PACKAGE_SETUP: ""
  PACKAGE_SETUP_SHA: ""
  PACKAGE_TAR: ""
  PACKAGE_DEB: ""
  PACKAGE_DEB_SHA: ""

jobs:
  windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare package
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main" -or $version -eq "master") {
            $version = "dev-${{ github.run_number }}"
          }
          if ($version -like 'v*') { $version = $version.Substring(1) }
          $safeVersion = $version -replace '[^A-Za-z0-9._-]', '-'

          $packageName = "${env:APP_NAME}-$safeVersion-windows-x64"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "target/release/markdownmonkey.exe" (Join-Path $packageDir "${env:APP_NAME}.exe")
          Copy-Item "README.md" (Join-Path $packageDir "README.md")
          Copy-Item "README_EN.md" (Join-Path $packageDir "README_EN.md")
          Copy-Item "LICENSE" (Join-Path $packageDir "LICENSE")

          $zipPath = Join-Path "dist" "$packageName.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath
          }
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath

          $hash = Get-FileHash -Algorithm SHA256 $zipPath
          $shaPath = "$zipPath.sha256"
          "$($hash.Hash)  $(Split-Path $zipPath -Leaf)" | Set-Content -Path $shaPath -Encoding ascii

          "PACKAGE_VERSION=$safeVersion" >> $env:GITHUB_ENV
          "PACKAGE_ZIP=$zipPath" >> $env:GITHUB_ENV
          "PACKAGE_SHA=$shaPath" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $safeVersion = "${{ env.PACKAGE_VERSION }}"
          $repoRoot = (Get-Location).Path
          $src = Join-Path $repoRoot "dist\${env:APP_NAME}-$safeVersion-windows-x64"
          $outDir = Join-Path $repoRoot "dist"
          if (-not (Test-Path (Join-Path $src "LICENSE"))) {
            throw "Installer source missing LICENSE: $src"
          }
          $srcUnix = $src.Replace('\', '/')
          $outUnix = $outDir.Replace('\', '/')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$safeVersion" `
            "/DSourceDir=$srcUnix" `
            "/DOutputDir=$outUnix" `
            "packaging\windows\MarkdownMonkey.iss"
          $setup = Join-Path "dist" "${env:APP_NAME}-$safeVersion-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Inno Setup output missing: $setup" }
          $hash = Get-FileHash -Algorithm SHA256 $setup
          "$($hash.Hash)  $(Split-Path $setup -Leaf)" | Set-Content -Path "$setup.sha256" -Encoding ascii
          "PACKAGE_SETUP=$setup" >> $env:GITHUB_ENV
          "PACKAGE_SETUP_SHA=$setup.sha256" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.PACKAGE_VERSION }}-windows-x64
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA }}
            ${{ env.PACKAGE_SETUP }}
            ${{ env.PACKAGE_SETUP_SHA }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA }}
            ${{ env.PACKAGE_SETUP }}
            ${{ env.PACKAGE_SETUP_SHA }}
          generate_release_notes: true

  linux:
    name: Build Linux package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxtst-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare package
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="dev-${{ github.run_number }}"
          fi
          SAFE_VERSION=$(echo "$VERSION" | sed 's/^v//; s/[^A-Za-z0-9._-]/-/g')
          PACKAGE_NAME="${APP_NAME}-${SAFE_VERSION}-linux-x64"
          PACKAGE_DIR="dist/${PACKAGE_NAME}"
          mkdir -p "$PACKAGE_DIR"
          cp target/release/markdownmonkey "$PACKAGE_DIR/${APP_NAME}"
          cp README.md README_EN.md LICENSE "$PACKAGE_DIR/"
          cp packaging/linux/markdownmonkey.desktop "$PACKAGE_DIR/"
          chmod +x "$PACKAGE_DIR/${APP_NAME}"
          (
            cd dist
            tar -czf "${PACKAGE_NAME}.tar.gz" "$PACKAGE_NAME"
            sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
          )
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh "$SAFE_VERSION" target/release/markdownmonkey dist
          sha256sum "dist/${APP_NAME}-${SAFE_VERSION}-linux-x64.deb" > "dist/${APP_NAME}-${SAFE_VERSION}-linux-x64.deb.sha256"
          echo "PACKAGE_VERSION=${SAFE_VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_TAR=dist/${PACKAGE_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=dist/${PACKAGE_NAME}.tar.gz.sha256" >> "$GITHUB_ENV"
          echo "PACKAGE_DEB=dist/${APP_NAME}-${SAFE_VERSION}-linux-x64.deb" >> "$GITHUB_ENV"
          echo "PACKAGE_DEB_SHA=dist/${APP_NAME}-${SAFE_VERSION}-linux-x64.deb.sha256" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.PACKAGE_VERSION }}-linux-x64
          path: |
            ${{ env.PACKAGE_TAR }}
            ${{ env.PACKAGE_SHA }}
            ${{ env.PACKAGE_DEB }}
            ${{ env.PACKAGE_DEB_SHA }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE_TAR }}
            ${{ env.PACKAGE_SHA }}
            ${{ env.PACKAGE_DEB }}
            ${{ env.PACKAGE_DEB_SHA }}
          generate_release_notes: true

  macos:
    name: Build macOS package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare package
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="dev-${{ github.run_number }}"
          fi
          SAFE_VERSION=$(echo "$VERSION" | sed 's/^v//; s/[^A-Za-z0-9._-]/-/g')
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|aarch64) ARCH_LABEL="arm64" ;;
            x86_64) ARCH_LABEL="x64" ;;
            *) ARCH_LABEL="$ARCH" ;;
          esac
          PACKAGE_NAME="${APP_NAME}-${SAFE_VERSION}-macos-${ARCH_LABEL}"
          APP_DIR="dist/${APP_NAME}.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp target/release/markdownmonkey "${APP_DIR}/Contents/MacOS/${APP_NAME}"
          chmod +x "${APP_DIR}/Contents/MacOS/${APP_NAME}"
          sed "s/<string>0.6.4<\\/string>/<string>${SAFE_VERSION}<\\/string>/g" \
            packaging/macos/Info.plist > "${APP_DIR}/Contents/Info.plist"
          cp README.md README_EN.md LICENSE "${APP_DIR}/Contents/Resources/"
          ICON_SRC="assets/branding/icon.png"
          ICONSET="${APP_DIR}/Contents/Resources/AppIcon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 "$ICON_SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 "$ICON_SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 "$ICON_SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 "$ICON_SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 "$ICON_SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 "$ICON_SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 "$ICON_SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 "$ICON_SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 "$ICON_SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "${APP_DIR}/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"
          (
            cd dist
            tar -czf "${PACKAGE_NAME}.tar.gz" "${APP_NAME}.app"
            shasum -a 256 "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
          )
          echo "PACKAGE_VERSION=${SAFE_VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_TAR=dist/${PACKAGE_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=dist/${PACKAGE_NAME}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.PACKAGE_VERSION }}-macos
          path: |
            ${{ env.PACKAGE_TAR }}
            ${{ env.PACKAGE_SHA }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE_TAR }}
            ${{ env.PACKAGE_SHA }}
          generate_release_notes: true
