[package]
name = "markdownmonkey"
version = "0.6.1"
edition = "2021"
description = "A modern Markdown editor built with Dioxus"
authors = ["MarkdownMonkey Team"]
license = "MIT"

[dependencies]
# Dioxus 核心 / Dioxus core
dioxus = { version = "0.7.10", features = ["macro", "desktop"] }

# Markdown 解析
pulldown-cmark = "0.13"

# 代码块语法高亮（预览）/ Code-block syntax highlighting (preview)
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "html",
    "dump-load",
    "regex-fancy",
] }

# HTTP 客户端 (AI API)
reqwest = { version = "0.13", features = ["json", "stream", "rustls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

# 安全存储 (API Key)
# Secure storage for API keys
keyring-core = "1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 文件对话框
rfd = "0.17"

# 外部改文件：目录事件 + mtime 兜底 / External edits: directory events + mtime fallback
notify = "6.1.1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 搜索替换
regex = "1"

# Base64 编码（图片处理）
base64 = "0.23"

# 编码转换（GBK/GB2312 支持）
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
